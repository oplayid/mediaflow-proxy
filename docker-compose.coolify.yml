# Coolify-ready deployment for an image built by .github/workflows/main.yml.
# In Coolify: New Resource -> Docker Compose -> pick this file from the repo.
services:
  mfp:
    # Image is built and pushed to GHCR by .github/workflows/main.yml.
    # Coolify should set MFP_IMAGE=ghcr.io/oplayid/mediaflow-proxy:v2.9.6.
    image: ${MFP_IMAGE:-ghcr.io/oplayid/mediaflow-proxy:v2.9.6}
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      # Set this in Coolify's environment variables section (required).
      API_PASSWORD: ${API_PASSWORD:?API_PASSWORD must be set in Coolify}
      # Optional: enables /trailer/... YouTube trailer endpoints (TMDB v3 key).
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Optional: enables SubDL subtitle alternatives inside the mfp player.
      # Set this in Coolify's environment variables section; never commit the key.
      SUBDL_API_KEY: ${SUBDL_API_KEY:-}
      # Coolify sits behind Traefik; without this the client IP is read as 127.0.0.1
      # and IP-bound encrypted URLs will fail.
      FORWARDED_ALLOW_IPS: "*"
      # Pin the bind address so a platform-injected PORT cannot change it.
      GUNICORN_BIND: "0.0.0.0:8888"
      # Keep this set. It shares the transcode job registry and caches across
      # Gunicorn workers; without it a 4-worker deploy can 404 on transcode URLs.
      REDIS_URL: redis://redis:6379
      # Host order lives only in HOST_ORDER (VidCore, VSEmbed, VidSrcTo, VidLink).
      # Optional overrides — uncomment and set in Coolify as needed:
      # WEB_CONCURRENCY: "2"          # 2-4 is safe with Redis; use 1 only for Telegram interactive login
      # ENABLE_TRANSCODE: "false"
      # ENABLE_HLS_PREBUFFER: "false"
      # ENABLE_DASH_PREBUFFER: "false"
      # DISABLE_HOME_PAGE: "false"
      # DISABLE_DOCS: "false"
      # DISABLE_SPEEDTEST: "false"
      # PUBLIC_IP: "1.2.3.4"
      # For Turnstile-gated VSEmbed/VidSrcTo hosts, route upstream traffic through
      # a clean egress IP. all_proxy sends media segments, extractor requests and
      # SubDL through the proxy, so use a proxy with enough bandwidth. For a
      # narrower route, use transport_routes instead, for example:
      # TRANSPORT_CONFIG: '{"proxy_url":"http://user:pass@proxy:8080","all_proxy":true}'
      # TRANSPORT_CONFIG: '{"proxy_url":"http://user:pass@proxy:8080","transport_routes":{"all://*.example.com":{"proxy":true}}}'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
