<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MediaFlow Player</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/player.css">
</head>
<body>
  <div id="app">
    <video id="video" controls playsinline preload="metadata"></video>

    <div class="topbar">
      <span class="title" id="title">MediaFlow</span>
      <span class="badge" id="source-badge">menyiapkan…</span>
    </div>

    <div class="controls">
      <label>Server
        <select id="server-select" aria-label="Server video"></select>
      </label>
      <label>Kualitas
        <select id="quality-select" aria-label="Kualitas video"></select>
      </label>
      <label>Subtitle
        <select id="subtitle-select" aria-label="Subtitle"></select>
      </label>
      <select id="subtitle-language" aria-label="Bahasa subtitle yang diunggah" title="Bahasa subtitle custom">
        <option value="id">ID</option>
        <option value="en">EN</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
        <option value="zh">ZH</option>
        <option value="und">Lainnya</option>
      </select>
      <button type="button" id="subtitle-upload-button" title="Unggah subtitle .srt atau .vtt">Unggah Subtitle</button>
      <input type="file" id="subtitle-file" class="hidden" accept=".srt,.vtt,text/vtt,application/x-subrip">
      <span class="subtitle-status" id="subtitle-status" role="status" aria-live="polite"></span>
    </div>

    <div class="overlay" id="overlay">
      <div class="status" id="overlay-status">Memilih sumber video…</div>
      <div class="bar"><span id="overlay-bar"></span></div>
      <div class="hint" id="overlay-hint">MediaFlow memeriksa server sekali saat player dibuka. Gunakan pilihan Server untuk mengganti sumber secara manual.</div>
    </div>

    <div class="error-box hidden" id="error-box">
      <div class="status" id="error-status">Video tidak dapat diputar.</div>
      <div class="hint" id="error-hint">Sumber video yang dipilih tidak merespons. Silakan coba lagi nanti.</div>
    </div>
  </div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/vendor/dash.all.min.js"></script>
  <!-- CSP-safe data block: script-src 'self' forbids executable inline scripts,
       but a non-JavaScript type is a data block and is never executed. -->
  <script type="application/json" id="mfp-session">/*__MFP_SESSION__*/null</script>
  <script src="/player.js"></script>
</body>
</html>
