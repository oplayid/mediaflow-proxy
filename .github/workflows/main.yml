name: MediaFlow Proxy CI/CD

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. 2.4.7 or v2.4.7)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mediaflow_proxy_docker_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
    steps:
      - name: Resolve tag
        id: resolve_tag
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          REF="$RAW_TAG"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ! git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$RAW_TAG" >/dev/null 2>&1; then
            if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/v$VERSION" >/dev/null 2>&1; then
              REF="v$VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building $REGISTRY/$IMAGE_NAME:v$VERSION from ref $REF"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.resolve_tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=MediaFlow Proxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.resolve_tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Trigger Coolify deployment
        if: ${{ success() && env.COOLIFY_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "$COOLIFY_WEBHOOK_URL"

  publish_to_pypi:
    if: github.event_name == 'release' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: get_version
      run: |
        # Remove 'v' prefix if present (e.g., v1.2.3 -> 1.2.3)
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Update version in pyproject.toml
      run: |
        # Update the version in pyproject.toml using sed
        sed -i 's/^version = ".*"/version = "${{ steps.get_version.outputs.version }}"/' pyproject.toml
        echo "Updated pyproject.toml version to: ${{ steps.get_version.outputs.version }}"
        # Verify the change
        grep '^version = ' pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build package
      run: uv build

    - name: Build and publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

  generate_release_notes:
    if: github.event_name == 'release' && vars.GENERATE_RELEASE_NOTES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Persist GitHub-generated release body
        run: |
          cat << 'EOF' > github_generated_release_body.md
          ${{ github.event.release.body }}
          EOF

      - name: Extract versions
        id: extract_versions
        run: |
          if ! PREVIOUS_VERSION=$(grep -o '/compare/.*\.\.\.' github_generated_release_body.md | sed 's/\/compare\///' | sed 's/\.\.\.//' || true); then
            echo "Error: Failed to extract previous version from release body"
            exit 1
          fi
          echo "PREVIOUS_VERSION=${PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          make generate-notes VERSION_OLD=${{ steps.extract_versions.outputs.PREVIOUS_VERSION }} VERSION_NEW=${{ github.ref_name }} GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} GITHUB_RELEASE_BODY_FILE=github_generated_release_body.md > release_notes.md

      - name: Update Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
